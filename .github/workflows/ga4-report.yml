# Read-only Google Analytics (GA4) reports for the app, printed to the job
# log. Uses a service account with the Viewer role on the property.
#
# Secrets:
#   GA4_SA_KEY_JSON   — service-account key JSON (Viewer on the property)
#   GA4_PROPERTY_ID   — optional; defaults to the app's property below
name: GA4 report

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "30"
      owner_email:
        description: "gsc_owner only: Google account to add as a Search Console owner"
        required: false
        default: ""
      report:
        description: "all | daily | events | versions | friend_detail | screens | audience | retention | gsc_probe | gsc_token | gsc_verify | gsc_submit | gsc_status | gsc_owner"
        required: false
        default: "all"
  push:
    # Bootstrap: a workflow is only dispatchable once it exists on the
    # default branch. Until then a push touching these files runs it.
    branches:
      - claude/nifty-babbage-srmr16
    paths:
      - ".github/workflows/ga4-report.yml"
      - ".github/scripts/ga4_report.py"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet google-auth requests
      - name: Run reports
        env:
          GA4_SA_KEY_JSON: ${{ secrets.GA4_SA_KEY_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID || '540029267' }}
          DAYS: ${{ inputs.days || '30' }}
          REPORT: ${{ inputs.report || 'all' }}
          OWNER_EMAIL: ${{ inputs.owner_email || '' }}
        run: |
          # gsc_* modes drive Search Console through the same service account
          # (see .github/scripts/search_console.py); everything else is GA4.
          case "$REPORT" in
            gsc_*) python .github/scripts/search_console.py --mode "${REPORT#gsc_}" ;;
            *)     python .github/scripts/ga4_report.py --days "$DAYS" --report "$REPORT" ;;
          esac
