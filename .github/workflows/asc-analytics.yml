# App Store Connect acquisition numbers (downloads by day/country from Sales
# Reports; impressions / product page views from Analytics Reports once
# Apple has produced them). Read-only apart from creating the analytics
# report request the first time. Uses the same ASC API key as release.yml.
name: ASC analytics

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "30"
  push:
    # Bootstrap until this lands on main (see release.yml history).
    branches:
      - claude/nifty-babbage-srmr16
    paths:
      - ".github/workflows/asc-analytics.yml"
      - ".github/scripts/asc_analytics.py"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "PyJWT[crypto]" requests
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: "94362919"
          ASC_BUNDLE_ID: nikitaspiridonov.non-bank
          DAYS: ${{ inputs.days || '30' }}
        run: python .github/scripts/asc_analytics.py
