name: backend-deploy

# Deploys the Cloudflare Worker (backend/) with wrangler. Manual only: the
# Worker serves production API + the public site, so a deploy is an explicit
# act. Runs the backend test suite first and aborts on failure.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — API token with "Workers Scripts: Edit" (+ "Workers
#                           Routes: Edit" for the custom domain) on the account
#   CLOUDFLARE_ACCOUNT_ID — the account id from the Cloudflare dashboard

on:
  # Bootstrap: a workflow is only dispatchable once it exists on the default
  # branch. Until then, a push to this file on the feature branch runs it.
  # Remove this trigger after the first merge to main.
  push:
    branches: [claude/nifty-babbage-srmr16]
    paths: [.github/workflows/backend-deploy.yml]
  workflow_dispatch:
    inputs:
      env:
        description: "production | staging"
        required: false
        default: "production"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Check the Cloudflare token (prints its permissions, never the token)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token length: ${#CLOUDFLARE_API_TOKEN}  account id length: ${#CLOUDFLARE_ACCOUNT_ID}"
          # Cloudflare's own verify endpoint: tells whether the token is active
          # and which policies it carries, independent of wrangler's version.
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("verify:", json.dumps({"success": d.get("success"), "status": (d.get("result") or {}).get("status"), "errors": d.get("errors")}))'
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("account:", json.dumps({"success": d.get("success"), "name": (d.get("result") or {}).get("name"), "errors": d.get("errors")}))'
          # Shape of the secret, without revealing it: Cloudflare API tokens
          # are 40 chars of [A-Za-z0-9_-]; a 64-char all-hex string is a
          # hash or an id, not a token.
          python3 - <<'PY'
          import os, re
          t = os.environ["CLOUDFLARE_API_TOKEN"]
          print("shape: len=%d hex_only=%s has_whitespace=%s has_dash_or_underscore=%s mixed_case=%s" % (
              len(t), bool(re.fullmatch(r"[0-9a-fA-F]+", t)), any(c.isspace() for c in t),
              any(c in "-_" for c in t), t != t.lower() and t != t.upper()))
          PY
          # Account-owned tokens verify against a different endpoint.
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("account-token verify:", json.dumps({"success": d.get("success"), "status": (d.get("result") or {}).get("status"), "errors": d.get("errors")}))'
          npx wrangler whoami || true
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.env || 'production' }}" = "staging" ]; then
            npx wrangler deploy --env staging
          else
            npx wrangler deploy
          fi
      - name: Smoke-check the public site
        if: (github.event.inputs.env || 'production') != 'staging'
        run: |
          for p in / /robots.txt /sitemap.xml /og.png /support /privacy; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://non-bank.app$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
